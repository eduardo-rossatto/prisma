name: Keep Alive

on:
  schedule:
    - cron: "0 */3 * * *"   # a cada 3 horas
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping PRISMA app
        run: |
          URL="${{ vars.PRISMA_APP_URL }}"
          if [ -z "$URL" ]; then
            echo "PRISMA_APP_URL não configurada — configure em Settings > Variables > Actions"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || echo "000")
          echo "HTTP status: $STATUS"
          echo "App pingado: $URL"
